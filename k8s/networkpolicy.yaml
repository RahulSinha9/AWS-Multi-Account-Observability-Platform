apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-demo
  namespace: observability-demo
spec:
  podSelector:
    matchLabels:
      app: observability-demo
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - {}
